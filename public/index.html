<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Meta de Ahorro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor">
    <h1><img src="logo.png" alt="Logo Mi Meta de Ahorro" class="logo"><br>Mi Meta de Ahorro</h1>
    <p class="subtitulo">Tus metas, guardadas para siempre.</p>

    <div id="lista-metas" class="lista-metas"></div>

    <button type="button" id="btn-nueva-meta" class="btn-nueva-meta">+ Nueva meta</button>

    <form id="form-meta" class="oculto">
      <label>
        ¿Qué querés lograr?
        <input type="text" id="nombre" placeholder="Ej: comprar una moto" required>
      </label>

      <label>
        Monto objetivo ($)
        <input type="number" id="montoObjetivo" min="0" step="1" required>
      </label>

      <label>
        Dinero que ya tenés ($)
        <input type="number" id="dineroInicial" min="0" step="1" value="0" required>
      </label>

      <label>
        ¿Cuánto podés ahorrar por mes? ($)
        <input type="number" id="ahorroMensual" min="0" step="1" required>
      </label>

      <label>
        Plazo (meses)
        <input type="number" id="plazoMeses" min="1" step="1" required>
      </label>

      <button type="button" id="btn-simular">Simular</button>

      <div id="resultado-simulacion" class="resultado-simulacion oculto"></div>

      <button type="button" id="btn-guardar-meta" class="oculto">💾 Guardar meta</button>
      <div id="mensaje-ia-simulacion" class="mensaje-ia oculto"></div>
      <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
